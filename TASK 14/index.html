
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <div class="logo">✊ ✋ ✌️</div>

        <h1>ROCK PAPER SCISSORS</h1>
        <p><i>Choose your move and play against a bot.</i></p>

        <div class="war">

            <div class="match">
                <h2>Your Choice:</h2>
                <p id="user-move">Waiting...</p>
                <h2>Your Score: <span id="user-score">0</span></h2>
            </div>

            <div class="match">
                <h2>Bot's Choice:</h2>
                <p id="bot-move">Waiting...</p>
                <h2>Bot's Score: <span id="bot-score">0</span></h2>
            </div>

        </div>

        <p id="result">Let's Play!</p>

        <div class="choice">
            <button class="game">ROCK</button>
            <button class="game">PAPER</button>
            <button class="game">SCISSORS</button>
        </div>

        <button id="again">PLAY AGAIN</button>

        <footer>Let's see who wins!</footer>

    </div>

    <script src="script.js"></script>

</body>
</html>
